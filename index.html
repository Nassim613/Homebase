<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Homebase</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B2640">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>
<div id="app">
  <header class="top" id="pageHeader">
    <div class="back" id="headerLeft">
      <div>
        <div class="eyebrow" id="dateLine"></div>
        <div id="signedInAs" style="font-size:11px;color:var(--ink-soft);margin-top:-2px"></div>
        <h1 id="pageTitle">Finances</h1>
      </div>
    </div>
    <span class="status-pill offline" id="syncPill"><i class="ti ti-cloud"></i> <span id="syncText">Not connected</span></span>
    <div style="position:relative;display:inline-block">
      <button id="manualRefreshBtn" onclick="manualRefresh()" title="Refresh now" style="border:none;background:var(--surface-raised);border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;margin-left:6px;cursor:pointer;color:var(--ink-soft)"><i class="ti ti-refresh" id="manualRefreshIcon"></i></button>
      <span id="manualRefreshStatus" style="position:absolute;top:34px;right:0;font-size:11px;color:#0F6E56;white-space:nowrap;opacity:0;transition:opacity 0.3s;pointer-events:none"></span>
    </div>
  </header>

  <main id="mainContent">
    <!-- Views are rendered here by app.js -->
    <div class="empty-state">Loading…</div>
  </main>

  <button class="fab" id="fab" style="display:none"><i class="ti ti-plus"></i></button>

  <nav class="tabs">
    <p class="sidebar-title">Homebase</p>
    <button data-tab="finance" class="active"><i class="ti ti-report-money"></i><span class="label">Finance</span></button>
    <button data-tab="jazz"><i class="ti ti-paw"></i><span class="label">Jazz</span></button>
    <button data-tab="weight"><i class="ti ti-scale"></i><span class="label">Weight</span></button>
    <button data-tab="garage"><i class="ti ti-car"></i><span class="label">Garage</span></button>
    <button data-tab="more"><i class="ti ti-settings"></i><span class="label">Settings</span></button>
  </nav>

  <div id="modalOverlay" class="modal-backdrop" style="display:none" onclick="if(event.target===this) closeModal()">
    <div class="modal-sheet" id="modalSheet"></div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client"></script>
<script src="storage.js"></script>
<script src="auth.js"></script>
<script src="sync.js"></script>
<script src="garage.js"></script>
<script src="import.js"></script>
<script src="app.js"></script>
</body>
</html>
